################################################################################
# Configuration file for BlobStore plugin
blobstore.folder.split.word_size=3
blobstore.file.system.path=/var/blobs/
blobstore.file.system.depth=1

################################################################################
# Configuration read by the CDI producers of the plugin

# blobstore.fileSystemBlobStoreService : name of the shipped file system store, must match its CDI bean name
blobstore.fileSystemBlobStoreService.name=blobstore.fileSystemBlobStoreService

# blobstore.databaseBlobStoreService : name of the shipped database store, must match its CDI bean name
blobstore.databaseBlobStoreService.name=blobstore.databaseBlobStoreService

# blobstore.blobStoreFileService : names of the CDI beans passed to the constructor
blobstore.blobStoreFileService.downloadService=defaultFileDownloadService
blobstore.blobStoreFileService.rbacService=defaultFileNoRBACService
blobstore.blobStoreFileService.blobStoreService=blobstore.fileSystemBlobStoreService

# blobstore.requestAuthenticator : read by AbstractSignRequestAuthenticatorProducer (library-signrequest)
blobstore.requestAuthenticator.name=signrequest.RequestHashAuthenticator
blobstore.requestAuthenticator.cfg.hashService=signrequest.Sha1HashService
blobstore.requestAuthenticator.cfg.signatureElements=blobstore,blob_key
blobstore.requestAuthenticator.cfg.privateKey=change me
